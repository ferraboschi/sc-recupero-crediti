# SC Recupero Crediti - Render Blueprint
# Deploy: https://render.com/deploy → Connect GitHub repo
# Il database è su Supabase (PostgreSQL), non serve un DB Render

services:
  - type: web
    name: sc-recupero-api
    runtime: python
    plan: standard  # 1 CPU / 2GB. Salito da starter (0.5 CPU) il 21/08: su starter
    # il sync pesante (parsing HTML fatture + matching rapidfuzz) teneva la GIL e
    # affamava /api/health → timeout 5s → "server failure" di Render. NB: il piano
    # reale lo imposta l'owner dal dashboard (questo file è documentazione).
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard (Supabase connection string)
      - key: FATTURAPRO_API_URL
        sync: false
      - key: FATTURAPRO_API_KEY
        sync: false
      - key: FATTURAPRO_DOMAIN
        sync: false
      - key: FATTURA24_API_KEY
        sync: false
      - key: SHOPIFY_STORE_URL
        sync: false
      - key: SHOPIFY_ACCESS_TOKEN
        sync: false
      - key: SHOPIFY_API_VERSION
        value: "2026-01"
      - key: SHOPIFY_PIVA_FIELD
        value: address2
      - key: TIMEZONE
        value: Europe/Rome
      - key: SCHEDULER_HOUR
        value: "8"
      - key: SCHEDULER_MINUTE
        value: "30"
      - key: CORS_ORIGINS
        value: "https://recupero.sakecompany.com"
      - key: PYTHON_VERSION
        value: "3.12.0"
